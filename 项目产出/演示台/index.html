<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gmall 电商离线数仓 · 演示台</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --line:#e2e6eb; --line2:#eef1f4;
    --text:#1b1f24; --muted:#5f6b7a; --dim:#8b95a3;
    --accent:#1f5fbf; --accent-bg:#eaf1fb;
    --ok:#0f7b3f; --ok-bg:#e8f5ee;
    --bad:#b42318; --bad-bg:#fdecea;
    --warn:#8a5b00; --warn-bg:#fdf3e2;
    --mono:"Cascadia Mono","Consolas","SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    font-size:15px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 20px 48px}

  header{
    position:sticky; top:0; z-index:20; background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line); backdrop-filter:saturate(120%) blur(6px);
  }
  .head-in{max-width:1160px;margin:0 auto;padding:12px 20px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:17px;font-weight:600;letter-spacing:.2px}
  .brand span{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;
    padding:8px 13px;border-radius:8px 8px 0 0;cursor:pointer;
    border-bottom:2px solid transparent;transition:.15s;
  }
  nav button:hover{color:var(--text);background:var(--line2)}
  nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;background:transparent}
  .pill{
    font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:#fff;white-space:nowrap;
  }
  .pill.ok{color:var(--ok);background:var(--ok-bg);border-color:#bfe3ce}
  .pill.bad{color:var(--bad);background:var(--bad-bg);border-color:#f3c6c1}
  .pill.wait{color:var(--warn);background:var(--warn-bg);border-color:#f0dcb4}

  section{display:none;padding-top:22px}
  section.on{display:block}

  .hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px}
  .hero h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:.2px}
  .hero .role{color:var(--muted);font-size:13px;margin-bottom:12px}
  .hero .one{font-size:16px;margin:0 0 8px}
  .hero .sub{color:var(--muted);font-size:14px;margin:0}
  .hero .repo{margin-top:12px;font-size:13px;color:var(--dim);font-family:var(--mono)}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi .lb{font-size:13px;color:var(--muted)}
  .kpi .vl{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.3px;margin:2px 0 0}
  .kpi .vl em{font-style:normal;font-size:14px;color:var(--muted);margin-left:4px;font-weight:400}
  .kpi .nt{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:4px}

  h2{font-size:18px;font-weight:600;margin:26px 0 12px;padding-left:10px;border-left:3px solid var(--accent)}
  h3{font-size:16px;font-weight:600;margin:0 0 8px}
  .lead{color:var(--muted);font-size:14px;margin:-4px 0 14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
  .card.tight{padding:12px 14px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:13px;background:#fafbfc}
  tr:last-child td{border-bottom:0}
  td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .mono{font-family:var(--mono);font-size:13px}

  .layer{display:grid;grid-template-columns:172px 1fr;gap:18px;align-items:start}
  .lv-badge{background:var(--accent-bg);color:var(--accent);border-radius:8px;padding:10px 12px}
  .lv-badge b{font-size:17px;letter-spacing:1px;display:block}
  .lv-badge i{font-style:normal;font-size:13px;display:block;margin-top:2px}
  .lv-badge p{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}

  .story{border-left:3px solid var(--accent);padding-left:16px;margin-bottom:18px}
  .story h3{font-size:16.5px}
  .oneshot{background:var(--accent-bg);border-radius:8px;padding:10px 14px;font-size:14.5px;margin:8px 0 12px;color:#163c73}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:2px 12px;font-size:14px;margin:8px 0}
  .kv .k{color:var(--muted);font-size:13px}
  .note{border-left:2px solid var(--line);padding-left:12px;color:#3d4753;font-size:14px;margin:10px 0}
  .note b{color:var(--text)}
  .boundary{background:#fdf9ef;border:1px solid #f0e2c4;border-radius:8px;padding:10px 14px;font-size:13.5px;color:#5d4a1f;margin-top:10px}
  .lesson{color:var(--muted);font-size:13.5px;margin-top:8px;font-style:normal}

  .grid8{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .path{display:flex;gap:10px;align-items:baseline;background:#fafbfc;border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13.5px}
  .path .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:16px}
  .path .s{font-family:var(--mono);font-size:12.5px;color:#3d4753;word-break:break-all}

  .btn{
    border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:14px;
    padding:7px 14px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  .btn:hover{border-color:#c8d2dd;background:#fafbfc}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#1a51a6}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.sm{padding:4px 10px;font-size:13px}

  .ports{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .port{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff}
  .port .p{font-family:var(--mono);font-size:13px;font-weight:600}
  .port .nm{color:var(--dim);font-size:12px}
  .port.up{border-color:#bfe3ce;background:var(--ok-bg)}
  .port.up .st{color:var(--ok)}
  .port.dn{border-color:#f0d5d2;background:#fdf6f5}
  .port.dn .st{color:var(--bad)}
  .port .st{font-size:12px}

  .qcard{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:#fff;margin-bottom:10px}
  .qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .qhead b{font-size:15px}
  .qhead .proof{color:var(--dim);font-size:12.5px}
  .qhead .btn{margin-left:auto}
  .qsql{font-family:var(--mono);font-size:12.5px;color:#45505d;background:#f7f9fb;border-radius:6px;padding:7px 10px;margin:8px 0 0;word-break:break-all}
  .qmeta{font-size:12.5px;color:var(--dim);margin-top:6px}
  .qout{
    margin-top:10px;background:#0f1419;color:#d7e2ec;border-radius:8px;padding:11px 13px;
    font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;
    max-height:260px;overflow:auto;
  }
  .qout.ok{border-left:3px solid #3ec27a}
  .qout.bad{border-left:3px solid #e2564d}
  .qerr{color:#f0b3ae}

  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .step{border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--muted);background:#fff}
  .step.doing{border-color:#c9b98a;background:var(--warn-bg);color:var(--warn)}
  .step.done{border-color:#bfe3ce;background:var(--ok-bg);color:var(--ok)}
  .step.fail{border-color:#f0d5d2;background:var(--bad-bg);color:var(--bad)}
  .log{background:#f7f9fb;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;color:#45505d;max-height:180px;overflow:auto;white-space:pre-wrap}

  .search{display:flex;gap:10px;margin-bottom:14px}
  .search input{
    flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--text);outline:none;
  }
  .search input:focus{border-color:#a9c3e8;box-shadow:0 0 0 3px rgba(31,95,191,.08)}
  .qa{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;margin-bottom:10px}
  .qa .q{font-size:15px;font-weight:600}
  .qa .s{color:#24589e;font-size:14px;margin:6px 0}
  .qa .d{font-size:14px;color:#3d4753}
  .qa .src{font-size:12.5px;color:var(--dim);margin-top:8px}

  #screen-frame{width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);border-radius:10px;background:#fff}

  .banner{background:var(--bad-bg);border:1px solid #f0d5d2;color:var(--bad);border-radius:8px;padding:10px 14px;margin:16px 0;font-size:14px}
  .hint{font-size:13px;color:var(--dim);margin-top:10px}

  .modal{position:fixed;inset:0;background:rgba(16,20,26,.42);display:none;align-items:center;justify-content:center;padding:32px;z-index:60}
  .modal.on{display:flex}
  .modal .box{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
  .modal .hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .modal .hd b{font-size:15px}
  .modal .hd .btn{margin-left:auto}
  .modal pre{margin:0;padding:18px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.6;color:#243040;background:#fbfcfd}

  @media (max-width:980px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .layer{grid-template-columns:1fr}
    .ports{grid-template-columns:repeat(2,1fr)}
    .grid8{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">gmall 电商离线数仓<span>项目演示台</span></div>
    <nav id="nav">
      <button data-tab="overview" class="on">概览</button>
      <button data-tab="layers">链路</button>
      <button data-tab="evidence">证据</button>
      <button data-tab="screen">大屏</button>
      <button data-tab="live">实时</button>
      <button data-tab="qa">问答</button>
    </nav>
    <div class="pill wait" id="pill">检查集群…</div>
  </div>
</header>

<div class="wrap">
  <div id="err"></div>

  <section id="tab-overview" class="on"></section>
  <section id="tab-layers"></section>
  <section id="tab-evidence"></section>
  <section id="tab-screen">
    <h2>ECharts 数据大屏</h2>
    <p class="lead">直连 ADS 层输出的六个看板，离线可用。下方是真实页面，不是截图。</p>
    <iframe id="screen-frame" src="/viz/dashboard_real.html" title="数据大屏"></iframe>
  </section>
  <section id="tab-live"></section>
  <section id="tab-qa"></section>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div class="hd"><b id="modal-title">DDL</b><button class="btn sm" onclick="closeModal()">关闭</button></div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script>
"use strict";

var F = null;             // 证据.json
var CACHE = {};           // 上次实测耗时
var HEALTH = null;        // 集群健康
var TIMERS = {};          // 运行中计时器

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function jget(url){
  return fetch(url, {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}

/* ---------------- 页签 ---------------- */
function activateTab(t){
  var btns = document.querySelectorAll("#nav button");
  var hit = false;
  for(var i=0;i<btns.length;i++){
    var on = btns[i].getAttribute("data-tab") === t;
    btns[i].classList.toggle("on", on);
    if(on) hit = true;
  }
  if(!hit) t = "overview";
  var secs = document.querySelectorAll("section");
  for(var j=0;j<secs.length;j++) secs[j].classList.toggle("on", secs[j].id === "tab-"+t);
  if(location.hash !== "#"+t) history.replaceState(null, "", "#"+t);
  window.scrollTo(0, 0);
  if(t === "live" && (!HEALTH || !HEALTH.ok)) checkHealth(true);
}

document.getElementById("nav").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  activateTab(b.getAttribute("data-tab"));
});

/* ---------------- 概览 ---------------- */
function renderOverview(){
  var p = F.project, kp = F.kpis.map(function(k){
    return '<div class="kpi"><div class="lb">'+esc(k.label)+'</div>'
      + '<div class="vl">'+esc(k.value)+(k.unit?'<em>'+esc(k.unit)+'</em>':'')+'</div>'
      + '<div class="nt">'+esc(k.note)+'</div></div>';
  }).join("");

  $("#tab-overview").innerHTML =
    '<div class="hero">'
      + '<h1>'+esc(p.name)+'</h1>'
      + '<div class="role">'+esc(p.role)+' · '+esc(p.period)+'</div>'
      + '<p class="one">'+esc(p.oneline)+'</p>'
      + '<p class="sub">'+esc(p.subline)+'</p>'
      + '<div class="repo">'+esc(p.repo)+'</div>'
    + '</div>'
    + '<div class="kpis">'+kp+'</div>'
    + '<div class="card"><h3>一句话讲清这个项目</h3>'
      + '<table>'
      + '<tr><th style="width:90px">是什么</th><td>一套自建的离线数仓：从原始 CSV 一路做到 6 张应用表，再出大屏。</td></tr>'
      + '<tr><th>数据是谁的</th><td>REES46 公开电商行为数据集，2019 年 10 月 31 天真实埋点，采样后 1,063 万行，非模拟造数。</td></tr>'
      + '<tr><th>难在哪</th><td>三节点、单容器上限 2048MB 的受限环境，所有结论都要在资源边界内跑出可对照的数字。</td></tr>'
      + '</table></div>'
    + '<div class="card"><h3>技术栈</h3><table><tr><th>组件</th><th>版本</th><th>备注</th></tr>'
      + F.stack.map(function(s){ return '<tr><td class="mono">'+esc(s.c)+'</td><td class="num">'+esc(s.v)+'</td><td style="color:var(--muted)">'+esc(s.n)+'</td></tr>'; }).join("")
      + '</table></div>'
    + '<p class="hint">数据更新：'+esc(F.meta.updated)+' · 出处：'+esc(F.meta.sources.join(" / "))+'</p>';
}

/* ---------------- 链路 ---------------- */
function renderLayers(){
  var html = '<h2>五层链路与 30 张表</h2>'
    + '<p class="lead">每张表声明粒度。主干是数据流（1,063 万行一路收敛到 6 张应用表），DIM 挂在旁边被查，不流向 ADS。</p>';

  F.layers.forEach(function(L){
    var rows = L.tables.map(function(t){
      return '<tr><td class="mono">'+esc(t.t)+'</td><td>'+esc(t.g)+'</td>'
        + '<td class="num">'+esc(t.rows)+'</td><td style="color:var(--muted)">'+esc(t.extra)+'</td></tr>';
    }).join("");
    var ddlBtn = L.tables.filter(function(t){ return F.ddl && F.ddl[t.t]; })
      .map(function(t){
        return '<button class="btn sm" onclick="showDDL(\''+t.t+'\')">看 '+t.t+' 的 DDL</button>';
      }).join(" ");
    html += '<div class="card"><div class="layer">'
      + '<div class="lv-badge"><b>'+esc(L.level)+'</b><i>'+esc(L.name)+'</i><p>'+esc(L.purpose)+'</p></div>'
      + '<div><table><tr><th>表</th><th>粒度</th><th>行数</th><th>说明</th></tr>'+rows+'</table>'
      + (ddlBtn?'<div style="margin-top:10px">'+ddlBtn+'</div>':'')
      + '</div></div></div>';
  });

  html += '<div class="card"><h3>两条链路：为什么还留着一套「废的」</h3>'
    + '<table><tr><th></th><th>旧链路（对照组）</th><th>新链路（正式）</th></tr>'
    + '<tr><td style="color:var(--muted)">数据</td><td>模拟生成，5 天 / 31.7 万行</td><td>REES46 真实，31 天 / 1,063 万行</td></tr>'
    + '<tr><td style="color:var(--muted)">表数</td><td>15 张</td><td>15 张</td></tr>'
    + '<tr><td style="color:var(--muted)">特征</td><td><b>数据是平的</b>：ads_dau 恒为 1000、复购率恒 &gt; 0.99</td><td>有波动、有脏数据、有真实业务形态</td></tr>'
    + '</table>'
    + '<div class="note">保留旧链路不是懒：它是「模拟数据会掩盖问题」这个判断的<b>物证</b>。删了它，换成真实数据这件事就失去了支撑。</div></div>';

  $("#tab-layers").innerHTML = html;
}

/* ---------------- 证据 ---------------- */
function renderEvidence(){
  var html = '<h2>三个技术点</h2>'
    + '<p class="lead">每个都带前后对照的实测数字，以及「这个结论在什么情况下不成立」。</p>';

  F.stories.forEach(function(s){
    var rows = s.rows.map(function(r){
      return '<div class="k">'+esc(r.k)+'</div><div>'+esc(r.v)+'</div>';
    }).join("");
    html += '<div class="card"><div class="story"><h3>'+esc(s.title)+'</h3>'
      + '<div class="oneshot">'+esc(s.oneshot)+'</div>'
      + '<div class="kv">'+rows+'</div>'
      + '<div class="note"><b>判断落在哪：</b>'+esc(s.insight)+'</div>'
      + '<div class="boundary"><b>边界：</b>'+esc(s.boundary)+'</div>'
      + '<div class="lesson">'+esc(s.lesson)+'</div>'
      + '</div></div>';
  });

  html += '<h2>双引擎：三个倍数，三套口径</h2>'
    + '<p class="lead">'+esc(F.engine.note)+'</p>'
    + '<div class="card"><table><tr><th>对比方式</th><th>Hive</th><th>Spark</th><th>倍数</th><th>能不能当结论</th></tr>'
    + F.engine.rows.map(function(r){
        return '<tr><td>'+esc(r.way)+'</td><td class="num">'+esc(r.hive)+'</td>'
          + '<td class="num">'+esc(r.spark)+'</td><td class="num"><b>'+esc(r.ratio)+'</b></td>'
          + '<td style="color:var(--muted)">'+esc(r.usable)+'</td></tr>';
      }).join("")
    + '</table></div>';

  html += '<h2>GMV 对账：'+esc(F.recon.count)+' 条路径收敛到同一个值</h2>'
    + '<p class="lead">'+esc(F.recon.value)+' —— 八条路径、两个引擎、两个库，逐条都能复算。</p>'
    + '<div class="card"><div class="grid8">'
    + F.recon.items.map(function(it){
        return '<div class="path"><span class="n">'+it.n+'</span><span><b>'+esc(it.path)+'</b><br>'
          + '<span class="s">'+esc(it.sql)+'</span></span></div>';
      }).join("")
    + '</div><div class="note">'+esc(F.recon.note)+'</div></div>';

  html += '<h2>数据里看出的三件事</h2>'
    + '<p class="lead">不是「跑通了」，是「看出了什么」。</p>';
  F.findings.forEach(function(f){
    html += '<div class="card"><h3>'+esc(f.title)+'</h3>'
      + '<div class="kv"><div class="k">实测</div><div>'+esc(f.evidence)+'</div>'
      + '<div class="k">所以</div><div>'+esc(f.conclusion)+'</div></div></div>';
  });

  html += '<h2>已知局限</h2>'
    + '<p class="lead">主动说出来，比被问出来强。</p>'
    + '<div class="card"><table><tr><th>局限</th><th>现状</th><th>影响</th></tr>'
    + F.limits.map(function(l){
        return '<tr><td><b>'+esc(l.k)+'</b></td><td>'+esc(l.v)+'</td><td style="color:var(--muted)">'+esc(l.impact)+'</td></tr>';
      }).join("")
    + '</table></div>';

  $("#tab-evidence").innerHTML = html;
}

/* ---------------- 实时 ---------------- */
function renderLive(){
  var html = '<h2>集群状态</h2>'
    + '<p class="lead">这一段是真实探测：每次刷新都真去连一次 SSH，读端口和进程。集群关着就如实显示关着。</p>'
    + '<div class="card" id="health-card"><div id="health-body">检查中…</div>'
    + '<div style="margin-top:12px"><button class="btn" onclick="checkHealth(true)">重新检查</button></div></div>';

  html += '<h2>一键启动三台虚拟机</h2>'
    + '<p class="lead">面试前 20 分钟点这里，不用再回 VMware 界面点三下。启动全程有真实进度，不会假装完成。</p>'
    + '<div class="card" id="boot-card">'
    + '<div class="steps" id="boot-steps"></div>'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    + '<button class="btn primary" id="boot-btn" onclick="doBoot()">启动集群</button>'
    + '<span class="hint" id="boot-hint">三台合计约 14.3 GB 内存；本机可用内存不足时会很卡。</span></div>'
    + '<div class="log" id="boot-log" style="margin-top:12px;display:none"></div>'
    + '</div>';

  html += '<h2>现场跑给你看</h2>'
    + '<p class="lead">每条都是真查询，返回的是集群当前的真实结果。耗时下面标的是「上次实测」，不是估算。</p>';

  Object.keys(F.live || {}).forEach(function(k){
    var q = F.live[k];
    html += '<div class="qcard" id="qc-'+k+'">'
      + '<div class="qhead"><b>'+esc(q.label)+'</b>'
      + '<span class="proof">'+esc(q.proof)+'</span>'
      + '<button class="btn primary sm" onclick="runLive(\''+k+'\',this)">运行</button></div>'
      + '<div class="qsql">'+esc(q.sql)+'</div>'
      + '<div class="qmeta" id="qm-'+k+'">'+esc(q.expect)+'</div>'
      + '<div id="qo-'+k+'"></div>'
      + '</div>';
  });

  $("#tab-live").innerHTML = html;
  renderHealth();
  renderBoot();
  renderCache();
}

function portHtml(h){
  return h.ports.map(function(p){
    return '<div class="port '+(p.up?'up':'dn')+'"><div class="p">'+p.port+'</div>'
      + '<div class="nm">'+esc(p.name)+'</div>'
      + '<div class="st">'+(p.up?'监听中':'未监听')+'</div></div>';
  }).join("");
}

function renderHealth(){
  var box = $("#health-body"); if(!box) return;
  var pill = $("#pill");
  if(!HEALTH){ box.innerHTML = '<span style="color:var(--muted)">检查中…</span>'; return; }

  if(!HEALTH.ok){
    pill.className = "pill bad";
    pill.textContent = "集群离线";
    box.innerHTML = '<div style="color:var(--bad);font-size:15px;font-weight:600">未连接</div>'
      + '<div style="color:var(--muted);font-size:14px;margin:6px 0 10px">'+esc(HEALTH.reason||"")+'</div>'
      + '<div class="hint">离线也可以继续演示：概览、链路、证据、大屏四个页签完全不依赖集群。</div>';
    return;
  }

  pill.className = "pill ok";
  pill.textContent = "集群在线 · 端口 " + HEALTH.ports_up + "/" + HEALTH.ports_total;

  var memTxt = "";
  if(HEALTH.mem){
    var parts = HEALTH.mem.split(" ");
    if(parts.length === 2){
      memTxt = '总 ' + (parts[0]/1024).toFixed(1) + ' GB，可用 ' + (parts[1]/1024).toFixed(1) + ' GB';
    }
  }
  box.innerHTML =
    '<table><tr><th style="width:110px">主机</th><td class="mono">'+esc(HEALTH.hostname)+'</td>'
    + '<th style="width:80px">运行</th><td>'+esc(HEALTH.uptime)+'</td></tr>'
    + '<tr><th>端口</th><td colspan="3">'+HEALTH.ports_up+' / '+HEALTH.ports_total+' 在监听</td></tr>'
    + '<tr><th>进程</th><td colspan="3" class="mono" style="font-size:12.5px">'+esc(HEALTH.jps||"（jps 无输出）")+'</td></tr>'
    + (memTxt?'<tr><th>内存</th><td colspan="3">'+memTxt+'</td></tr>':'')
    + '<tr><th>探测耗时</th><td colspan="3">'+HEALTH.elapsed+' 秒</td></tr>'
    + '</table><div class="ports">'+portHtml(HEALTH)+'</div>';
}

function checkHealth(force){
  var pill = $("#pill");
  if(force){ pill.className="pill wait"; pill.textContent="检查中…"; }
  jget("/api/health"+(force?"?force=1":"")).then(function(h){
    HEALTH = h; renderHealth();
  }).catch(function(e){
    HEALTH = {ok:false, reason:"本机服务未响应："+e.message, ports:[]};
    renderHealth();
  });
}

function renderBoot(){
  var wrap = $("#boot-steps"); if(!wrap) return;
  var st = window._BOOT;
  if(!st || !st.steps || !st.steps.length){
    wrap.innerHTML = '<span class="hint">尚未启动</span>'; return;
  }
  wrap.innerHTML = st.steps.map(function(s){
    var cls = s.state === "doing" ? "doing" : (s.state === "done" ? "done" : (s.state === "fail" ? "fail" : (s.state==="skip"?"done":"")));
    var word = s.state === "doing" ? "启动中" : (s.state === "done" ? "已就绪" : (s.state === "fail" ? "失败" : (s.state==="skip"?"已运行":"")));
    return '<div class="step '+cls+'">'+esc(s.name)+(word?' · '+word:'')+(s.msg?' · '+esc(s.msg):'')+'</div>';
  }).join("");
  var lg = $("#boot-log");
  if(st.log && st.log.length){ lg.style.display="block"; lg.textContent = st.log.join("\n"); lg.scrollTop = lg.scrollHeight; }
}

function doBoot(){
  var btn = $("#boot-btn");
  btn.disabled = true; btn.textContent = "启动中…";
  jget("/api/boot").then(function(r){
    window._BOOT = r.state; renderBoot();
    var timer = setInterval(function(){
      jget("/api/boot/status").then(function(s){
        window._BOOT = s; renderBoot();
        if(!s.running){
          clearInterval(timer);
          btn.disabled = false; btn.textContent = "再检查一次";
          setTimeout(function(){ checkHealth(true); }, 1200);
        }
      }).catch(function(){ clearInterval(timer); btn.disabled=false; btn.textContent="重试"; });
    }, 2000);
  }).catch(function(e){
    btn.disabled=false; btn.textContent="重试";
    $("#boot-hint").textContent = "启动失败：" + e.message;
  });
}

function renderCache(){
  Object.keys(CACHE).forEach(function(k){
    var el = $("#qm-"+k); if(!el) return;
    var q = (F.live||{})[k]; if(!q) return;
    var c = CACHE[k];
    el.innerHTML = esc(q.expect) + ' · 上次实测 <b>' + c.elapsed + ' 秒</b>（' + esc(c.at) + (c.ok?'':' · 失败') + '）';
  });
}

function runLive(key, btn){
  var card = $("#qc-"+key), out = $("#qo-"+key), meta = $("#qm-"+key);
  if(TIMERS[key]) return;
  btn.disabled = true; btn.textContent = "运行中";
  var t0 = Date.now();
  out.innerHTML = '<div class="qout">正在执行…  0.0s</div>';
  TIMERS[key] = setInterval(function(){
    var s = ((Date.now()-t0)/1000).toFixed(1);
    out.innerHTML = '<div class="qout">正在执行…  ' + s + 's' + (s > 20 ? '（Hive 首次连接较慢，属正常）' : '') + '</div>';
  }, 100);

  jget("/api/live?k=" + encodeURIComponent(key)).then(function(r){
    clearInterval(TIMERS[key]); delete TIMERS[key];
    btn.disabled = false; btn.textContent = "再跑一次";
    if(r.ok){
      out.innerHTML = '<div class="qout ok">' + esc(r.out) + '\n\n<span style="color:#8fa3b8">—— 实测 ' + r.elapsed + ' 秒</span></div>';
      meta.innerHTML = esc((F.live[key]||{}).expect) + ' · 本次 <b>' + r.elapsed + ' 秒</b>';
    }else{
      out.innerHTML = '<div class="qout bad"><span class="qerr">未返回结果</span>\n' + esc(r.reason || "") + '</div>';
      meta.innerHTML = esc((F.live[key]||{}).expect) + ' · <span style="color:var(--bad)">本次失败</span>';
    }
  }).catch(function(e){
    clearInterval(TIMERS[key]); delete TIMERS[key];
    btn.disabled = false; btn.textContent = "重试";
    out.innerHTML = '<div class="qout bad"><span class="qerr">本机服务异常</span>\n' + esc(e.message) + '</div>';
  });
}

/* ---------------- 问答 ---------------- */
function renderQA(){
  $("#tab-qa").innerHTML =
    '<h2>技术问答</h2>'
    + '<p class="lead">输入关键词直接定位，例如：倾斜、小文件、幂等、增量、维表、会话。</p>'
    + '<div class="search"><input id="q" type="text" placeholder="搜索关键词，或直接回车看全部" autocomplete="off">'
    + '<button class="btn" onclick="renderQAList()">搜索</button></div>'
    + '<div id="qa-list"></div>';
  var input = $("#q");
  input.addEventListener("input", renderQAList);
  input.addEventListener("keydown", function(e){ if(e.key === "Enter") renderQAList(); });
  renderQAList();
}

function renderQAList(){
  var box = $("#qa-list"); if(!box) return;
  var kw = (($("#q")||{}).value || "").trim().toLowerCase();
  var list = (F.qa||[]).filter(function(x){
    if(!kw) return true;
    var hay = (x.kw.join(" ") + " " + x.q + " " + x.short + " " + x.detail).toLowerCase();
    return hay.indexOf(kw) >= 0;
  });
  if(!list.length){
    box.innerHTML = '<div class="card" style="color:var(--muted)">没有匹配的条目。换个词试试：倾斜 / 小文件 / 幂等 / 增量 / 维表 / 会话。</div>';
    return;
  }
  box.innerHTML = list.map(function(x){
    return '<div class="qa"><div class="q">' + esc(x.q) + '</div>'
      + '<div class="s">' + esc(x.short) + '</div>'
      + '<div class="d">' + esc(x.detail) + '</div>'
      + '<div class="src">出处：' + esc(x.src) + '</div></div>';
  }).join("");
}

/* ---------------- DDL 弹层 ---------------- */
function showDDL(name){
  var sql = (F.ddl || {})[name]; if(!sql) return;
  $("#modal-title").textContent = name;
  $("#modal-body").textContent = sql;
  $("#modal").classList.add("on");
}
function closeModal(){ $("#modal").classList.remove("on"); }
document.getElementById("modal").addEventListener("click", function(e){
  if(e.target === this) closeModal();
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

/* ---------------- 启动 ---------------- */
(async function init(){
  try{
    var facts = await jget("/api/facts");
    if(facts.error) throw new Error(facts.error);
    F = facts;

    // live 定义在服务端，取回来挂在 facts 上（保持单一来源）
    var live = await jget("/api/live/spec").catch(function(){ return {queries:{}}; });
    F.live = live.queries || {};

    renderOverview();
    renderLayers();
    renderEvidence();
    renderLive();
    renderQA();

    try{ CACHE = await jget("/api/live/cache"); }catch(e){ CACHE = {}; }
    renderCache();

    activateTab((location.hash || "#overview").slice(1));
  }catch(e){
    $("#err").innerHTML = '<div class="banner">读取数据失败：' + esc(e.message)
      + '<br>请确认 serve.py 正在运行，且 <span class="mono">数据/证据.json</span> 存在。</div>';
  }
  checkHealth();
})();
</script>
